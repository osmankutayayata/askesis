<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Askesis</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Askesis">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<style>
body{margin:0}
[hidden]{display:none!important}
/* Layout: iOS 26 — large title that collapses into a glass nav bar, inset grouped lists, floating glass tab bar, floating sheets */
:root{
  /* iOS system palette (light) */
  --bg:#F2F2F7; --cell:#FFFFFF; --sheet:#F2F2F7; --cell-sheet:#FFFFFF;
  --label:#000000; --label-2:rgba(60,60,67,.60); --label-3:rgba(60,60,67,.30);
  --sep:rgba(60,60,67,.29); --fill-3:rgba(118,118,128,.12); --fill-2:rgba(120,120,128,.16);
  --tint:#007AFF; --on-tint:#FFFFFF; --tint-soft:rgba(0,122,255,.13);
  --green:#34C759; --green-text:#248A3D; --red:#FF3B30; --orange:#FF9500; --orange-text:#C93400;
  --thumb:#FFFFFF; --press:rgba(0,0,0,.05);
  --glass:rgba(255,255,255,.74); --glass-sel:rgba(0,0,0,.07);
  --lens:rgba(255,255,255,.22); --lens-rim:inset 0 0 0 1px rgba(255,255,255,.95),inset 3px 3px 4px -2px rgba(255,80,200,.45),inset -3px -3px 4px -2px rgba(30,170,255,.5),0 10px 26px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.08);
  --glass-shadow:0 10px 34px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.9);
  --scrim:rgba(0,0,0,.20); --nav-fade:rgba(242,242,247,.72);
  --font:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-display:system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-list:24px;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --tabbar-b:max(12px, calc(env(safe-area-inset-bottom,0px) - 6px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --cell:#1C1C1E; --sheet:#1C1C1E; --cell-sheet:#2C2C2E;
  --label:#FFFFFF; --label-2:rgba(235,235,245,.60); --label-3:rgba(235,235,245,.30);
  --sep:rgba(84,84,88,.65); --fill-3:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.32);
  --tint:#0A84FF; --on-tint:#FFFFFF; --tint-soft:rgba(10,132,255,.20);
  --green:#30D158; --green-text:#30D158; --red:#FF453A; --orange:#FF9F0A; --orange-text:#FF9F0A;
  --thumb:#636366; --press:rgba(255,255,255,.07);
  --glass:rgba(40,40,44,.72); --glass-sel:rgba(255,255,255,.12);
  --lens:rgba(255,255,255,.10); --lens-rim:inset 0 0 0 1px rgba(255,255,255,.35),inset 3px 3px 4px -2px rgba(255,80,200,.5),inset -3px -3px 4px -2px rgba(30,170,255,.55),0 10px 26px rgba(0,0,0,.5);
  --glass-shadow:0 10px 34px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.10),inset 0 1px 0 rgba(255,255,255,.08);
  --scrim:rgba(0,0,0,.45); --nav-fade:rgba(0,0,0,.70);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#000000; --cell:#1C1C1E; --sheet:#1C1C1E; --cell-sheet:#2C2C2E;
  --label:#FFFFFF; --label-2:rgba(235,235,245,.60); --label-3:rgba(235,235,245,.30);
  --sep:rgba(84,84,88,.65); --fill-3:rgba(118,118,128,.24); --fill-2:rgba(120,120,128,.32);
  --tint:#0A84FF; --on-tint:#FFFFFF; --tint-soft:rgba(10,132,255,.20);
  --green:#30D158; --green-text:#30D158; --red:#FF453A; --orange:#FF9F0A; --orange-text:#FF9F0A;
  --thumb:#636366; --press:rgba(255,255,255,.07);
  --glass:rgba(40,40,44,.72); --glass-sel:rgba(255,255,255,.12);
  --lens:rgba(255,255,255,.10); --lens-rim:inset 0 0 0 1px rgba(255,255,255,.35),inset 3px 3px 4px -2px rgba(255,80,200,.5),inset -3px -3px 4px -2px rgba(30,170,255,.55),0 10px 26px rgba(0,0,0,.5);
  --glass-shadow:0 10px 34px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.10),inset 0 1px 0 rgba(255,255,255,.08);
  --scrim:rgba(0,0,0,.45); --nav-fade:rgba(0,0,0,.70);
  color-scheme:dark;
}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--label);font:400 17px/22px var(--font);letter-spacing:-.41px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
input{font:inherit;letter-spacing:inherit;color:inherit}
h1,h2,p{margin:0}
.num-t{font-variant-numeric:tabular-nums}

/* ---------- text styles (iOS Dynamic Type defaults) ---------- */
.t-large{font:700 34px/41px var(--font-display);letter-spacing:.37px}
.t-title3{font:600 20px/25px var(--font-display);letter-spacing:-.45px}
.t-headline{font-weight:600}
.t-sub{font-size:15px;line-height:20px;letter-spacing:-.24px}
.t-foot{font-size:13px;line-height:18px;letter-spacing:-.08px}
.t-cap{font-size:12px;line-height:16px;letter-spacing:0}
.c2{color:var(--label-2)} .c3{color:var(--label-3)}

/* ---------- navigation bar ---------- */
.nav{position:fixed;top:0;left:0;right:0;z-index:8;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.nav::before{content:"";position:absolute;inset:0 0 -22px;background:var(--nav-fade);-webkit-backdrop-filter:blur(12px) saturate(1.6);backdrop-filter:blur(12px) saturate(1.6);-webkit-mask-image:linear-gradient(#000 62%,transparent);mask-image:linear-gradient(#000 62%,transparent);opacity:0;transition:opacity 180ms ease}
.nav.scrolled::before{opacity:1}
.nav-in{position:relative;max-width:640px;margin:0 auto;height:54px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.nav-title{font-weight:600;opacity:0;transform:translateY(5px);transition:opacity 160ms ease,transform 220ms var(--ease-out);white-space:nowrap}
.nav.scrolled .nav-title{opacity:1;transform:none}
.nav-l{justify-self:start;pointer-events:auto} .nav-r{justify-self:end;pointer-events:auto;display:flex;gap:8px}

/* glass buttons */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);box-shadow:var(--glass-shadow)}
.gbtn{height:44px;min-width:44px;padding:0 17px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:500;transition:transform 140ms var(--ease-out)}
.gbtn.icon{padding:0;width:44px}
.gbtn svg{width:20px;height:20px}
.gbtn.prominent{background:var(--tint);color:var(--on-tint);font-weight:600;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 6px 18px color-mix(in srgb,var(--tint) 35%,transparent)}
.gbtn:active{transform:scale(.94)}

/* ---------- page ---------- */
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(54px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:24px}
.wrap.has-dock{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.lt{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:2px 4px 0}
.lt-text{min-width:0}
.eyebrow{font-size:13px;line-height:18px;font-weight:600;letter-spacing:-.08px;text-transform:uppercase;color:var(--label-2)}
.lt h1{margin-top:1px;text-wrap:balance}
.avatar{flex:none;width:38px;height:38px;margin-bottom:2px}
.avatar svg{width:38px;height:38px;display:block}
.lt-sub{padding:0 4px;margin-top:-16px;color:var(--label-2)}
.lt-sub strong{color:var(--label);font-weight:600}

/* ---------- inset grouped lists ---------- */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px;min-height:32px}
.sec-h h2{min-width:0}
.sec-f{padding:0 16px;color:var(--label-2)}
.list{background:var(--cell);border-radius:var(--r-list);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:52px;padding:11px 16px;position:relative;width:100%;text-align:left}
.cell+.cell::before,.cell+.ex::before,.ex+.cell::before,.ex+.ex::before{content:"";position:absolute;top:0;right:0;left:var(--inset,16px);border-top:.5px solid var(--sep)}
.cell.chk{--inset:58px}
.cell .grow{flex:1;min-width:0}
.cell .ttl{overflow-wrap:anywhere}
.cell .sub{font-size:15px;line-height:20px;letter-spacing:-.24px;color:var(--label-2);margin-top:1px}
.cell .val{color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell.done .ttl{color:var(--label-2)}
button.cell{transition:background 120ms ease}
button.cell:active,.cell:has(> button.tap:active){background:var(--press);transition-duration:0ms}
.chev{flex:none;width:8px;height:14px;color:var(--label-3)}
.cell.destructive{justify-content:center;color:var(--red);font-weight:400}
.cell.action{color:var(--tint)}
.empty{padding:22px 16px;text-align:center;color:var(--label-2)}

/* Reminders-style check */
.check{flex:none;width:44px;height:44px;margin:-10px -4px -10px -10px;display:grid;place-items:center}
.check i{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--label-3);display:grid;place-items:center;transition:background 160ms ease,box-shadow 160ms ease,transform 140ms var(--ease-out)}
.check svg{width:14px;height:14px;color:#fff;opacity:0;transform:scale(.6);transition:opacity 140ms ease,transform 200ms var(--ease-out)}
.check:active i{transform:scale(.88)}
.check[aria-pressed="true"] i{background:var(--tint);box-shadow:none}
.check[aria-pressed="true"] svg{opacity:1;transform:none}

/* segmented control (capsule) */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:36px;padding:2px;border-radius:18px;background:var(--fill-3);position:relative;isolation:isolate}
.seg .thumb{position:absolute;z-index:-1;top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n,2));border-radius:16px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);transform:translateX(calc(var(--i,0) * 100%));transition:transform 300ms var(--ease-drawer)}
.seg button{border-radius:16px;font-size:14px;letter-spacing:-.15px;font-weight:500;transition:font-weight 0ms}
.seg button[aria-pressed="true"]{font-weight:600}
.seg .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--tint);margin-left:5px;vertical-align:2px}

/* small bordered capsule button (tinted) */
.cap{position:relative;height:30px;padding:0 13px;border-radius:15px;background:var(--tint-soft);color:var(--tint);font-size:15px;letter-spacing:-.24px;font-weight:600;display:inline-flex;align-items:center;gap:5px;transition:transform 140ms var(--ease-out),background 160ms ease,color 160ms ease}
.cap::after{content:"";position:absolute;inset:-7px -4px}
.cap:active{transform:scale(.95)}
.cap svg{width:13px;height:13px}
.cap[aria-pressed="true"]{background:var(--green);color:#fff}
.meal .list{transition:opacity 200ms ease}
.meal.eaten .list{opacity:.5}

/* progress */
.bar{height:4px;border-radius:2px;background:var(--fill-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:2px;background:var(--tint);transition:transform 320ms var(--ease-out);transform-origin:left}

/* status text */
.st-late{color:var(--red)} .st-today{color:var(--orange-text)} .st-good{color:var(--green-text)}

/* ---------- training ---------- */
.ex{position:relative;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:-4px 0}
.ex-idx{flex:none;width:22px;color:var(--label-3);font-weight:600;font-variant-numeric:tabular-nums;text-align:center}
.ex-head .grow{flex:1;min-width:0}
.ex-head .ttl{font-weight:600;overflow-wrap:anywhere}
.hint{display:flex;align-items:center;gap:5px;color:var(--green-text);font-weight:600;padding-left:34px}
.hint svg{width:13px;height:13px}
.sets{display:flex;flex-direction:column;gap:6px;padding-left:34px}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 74px 62px 18px;gap:8px;align-items:center}
.set-h{font-size:12px;line-height:16px;font-weight:500;color:var(--label-2);text-transform:uppercase;letter-spacing:.2px}
.set-h span:nth-child(1),.set-h span:nth-child(3),.set-h span:nth-child(4){text-align:center}
.set-n{color:var(--label-2);font-variant-numeric:tabular-nums;text-align:center;font-size:15px}
.last{justify-self:start;position:relative;color:var(--tint);font-size:15px;letter-spacing:-.24px;font-variant-numeric:tabular-nums;white-space:nowrap;padding:4px 0}
.last::after{content:"";position:absolute;inset:-6px -8px}
span.last{color:var(--label-3)}
button.last:active{opacity:.5}
.field{width:100%;height:38px;border:0;border-radius:10px;background:var(--fill-3);text-align:center;font-size:17px;font-weight:500;font-variant-numeric:tabular-nums;outline:none;-webkit-appearance:none;appearance:none;transition:box-shadow 120ms ease}
.field:focus{box-shadow:inset 0 0 0 2px var(--tint)}
.field::placeholder{color:var(--label-3);font-weight:400}
.trend{font-size:15px;font-weight:700;text-align:center}
.trend.up{color:var(--green)} .trend.down{color:var(--red)} .trend.same{color:var(--label-3)}

/* ---------- dock (above tab bar) ---------- */
.dock{position:fixed;z-index:7;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));bottom:calc(var(--tabbar-b) + 74px)}
.dock-in{max-width:440px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
.dock .gbtn{height:50px;border-radius:25px;font-size:17px}

/* ---------- Liquid Glass tab bar: floating capsule; the selection pill lifts into a lens when pressed or dragged ---------- */
.tabbar{position:fixed;z-index:9;left:max(20px,env(safe-area-inset-left,0px));right:max(20px,env(safe-area-inset-right,0px));bottom:var(--tabbar-b);pointer-events:none}
.tabbar-in{pointer-events:auto;position:relative;max-width:440px;margin:0 auto;height:64px;border-radius:32px;padding:4px;display:grid;grid-template-columns:repeat(4,1fr);touch-action:none;-webkit-user-select:none;user-select:none}
.tab-pill{position:absolute;z-index:0;top:4px;left:4px;height:56px;width:calc((100% - 8px) / 4);border-radius:28px;background:var(--glass-sel);translate:calc(var(--x,0) * 1px) 0;scale:1;transition:translate 460ms cubic-bezier(.32,1.28,.5,1),scale 320ms cubic-bezier(.32,1.28,.5,1),background 220ms ease,box-shadow 220ms ease;pointer-events:none}
.tabbar-in.pressing .tab-pill{scale:1.2 1.32;background:var(--lens);-webkit-backdrop-filter:blur(1.5px) saturate(1.9) brightness(1.06);backdrop-filter:blur(1.5px) saturate(1.9) brightness(1.06);box-shadow:var(--lens-rim)}
.tabbar-in.dragging .tab-pill{transition:scale 320ms cubic-bezier(.32,1.28,.5,1),background 220ms ease,box-shadow 220ms ease}
.tabbar-in.no-anim .tab-pill{transition:none}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--label);font-size:10px;line-height:12px;letter-spacing:.1px;font-weight:600;transition:color 160ms ease}
.tab svg,.tab span{transition:transform 280ms cubic-bezier(.32,1.28,.5,1)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"],.tab.hot{color:var(--tint)}
.tabbar-in.pressing .tab[aria-selected="true"]:not(.hot){color:var(--label)}
.tab.hot svg,.tab.hot span{transform:scale(1.14)}

/* ---------- sheets (floating, iOS 26) ---------- */
#sheet-root{position:fixed;inset:0;z-index:20}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity 260ms ease}
.sheet{--cell:var(--cell-sheet);position:absolute;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:8px;max-width:600px;margin:0 auto;max-height:calc(100dvh - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--sheet);border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.25);padding:6px 16px calc(18px + max(0px, env(safe-area-inset-bottom,0px) - 8px));transform:translateY(calc(100% + 16px));transition:transform 240ms var(--ease-drawer)}
#sheet-root.open .scrim{opacity:1}
#sheet-root.open .sheet{transform:translateY(0);transition:transform 460ms var(--ease-drawer)}
.sheet-in{display:flex;flex-direction:column;gap:22px}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:0 auto -10px;position:relative}
.grabber::before{content:"";position:absolute;inset:-14px -70px -8px}
.sheet-nav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px}
.sheet-nav h2{text-align:center;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.circ{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--fill-3);color:var(--label);transition:transform 140ms var(--ease-out)}
.circ svg{width:17px;height:17px}
.circ.ok{background:var(--tint);color:var(--on-tint)}
.circ:active{transform:scale(.92)}
.sheet .grabber,.sheet .sheet-nav{touch-action:none}
.input-cell input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:28px}
.input-cell input::placeholder{color:var(--label-3)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 2px}
.days button{aspect-ratio:1;border-radius:50%;background:var(--cell);font-size:15px;font-weight:600;color:var(--label);transition:background 160ms ease,color 160ms ease,transform 140ms var(--ease-out)}
.days button:active{transform:scale(.92)}
.days button[aria-pressed="true"]{background:var(--tint);color:var(--on-tint)}
.lbl{padding:0 16px;color:var(--label-2);font-size:13px;line-height:18px;letter-spacing:-.08px;text-transform:uppercase}


/* toast */
#toast{position:fixed;z-index:30;left:50%;bottom:calc(var(--tabbar-b) + 76px);transform:translate(-50%,14px) scale(.96);opacity:0;border-radius:24px;min-height:48px;padding:0 6px 0 18px;display:flex;align-items:center;gap:6px;font-size:15px;letter-spacing:-.24px;font-weight:500;max-width:calc(100% - 40px);white-space:nowrap;transition:opacity 180ms ease,transform 300ms var(--ease-out);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1);pointer-events:auto}
#toast:not(:has(button)){padding-right:18px}
#toast button{height:44px;padding:0 12px;color:var(--tint);font-weight:600}
body.dock-on #toast{bottom:calc(var(--tabbar-b) + 136px)}

@media (hover:hover) and (pointer:fine){
  button.cell:hover{background:var(--press)}
}
@media (prefers-reduced-motion:reduce){
  .sheet,#sheet-root.open .sheet{transform:none!important;transition:opacity 220ms ease!important}
  #sheet-root:not(.open) .sheet{opacity:0}
  #toast,#toast.show{transform:translate(-50%,0)}
  .seg .thumb,.nav-title{transition:opacity 160ms ease}
  .nav-title{transform:none}
  .gbtn:active,.cap:active,.check:active i,.tab:active svg,.circ:active,.days button:active{transform:none}
  .tabbar-in.pressing .tab-pill{scale:1} .tab.hot svg,.tab.hot span{transform:none}
  .tab-pill{transition:translate 200ms ease,background 200ms ease,box-shadow 200ms ease}
}
@media (prefers-reduced-transparency:reduce){
  .glass{background:var(--cell);-webkit-backdrop-filter:none;backdrop-filter:none}
  .nav::before{background:var(--bg);-webkit-backdrop-filter:none;backdrop-filter:none}
}
@media (prefers-contrast:more){
  :root{--sep:color-mix(in srgb,var(--label) 45%,transparent);--label-2:color-mix(in srgb,var(--label) 80%,transparent)}
  .list{box-shadow:0 0 0 1px var(--sep)}
}
</style>
</head>
<body>

<header class="nav" id="nav"><div class="nav-in"><div class="nav-l" id="nav-l"></div><div class="nav-title" id="nav-title"></div><div class="nav-r" id="nav-r"></div></div></header>
<main class="wrap" id="view" aria-live="polite"></main>
<div class="dock" id="dock" hidden></div>
<nav class="tabbar" aria-label="Sections"><div class="tabbar-in glass no-anim" role="tablist"><span class="tab-pill" aria-hidden="true"></span>
  <button class="tab" role="tab" data-tab="diet" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v5a2.5 2.5 0 0 0 5 0V3M7.5 3v18"/><path d="M17.5 3c-2.4 1.2-3.6 4.4-3.6 8.3 0 1.1.7 1.8 1.6 1.8h2Z" fill="currentColor"/><path d="M17.5 3v18"/></svg><span>Diet</span></button>
  <button class="tab" role="tab" data-tab="train" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="1.2" y="9" width="3" height="6" rx="1.2"/><rect x="4.4" y="5.8" width="3.6" height="12.4" rx="1.5"/><rect x="8" y="10.8" width="8" height="2.4" rx=".7"/><rect x="16" y="5.8" width="3.6" height="12.4" rx="1.5"/><rect x="19.8" y="9" width="3" height="6" rx="1.2"/></svg><span>Training</span></button>
  <button class="tab" role="tab" data-tab="skin" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.4c3.7 4.4 6.7 8.2 6.7 11.6a6.7 6.7 0 0 1-13.4 0c0-3.4 3-7.2 6.7-11.6Z"/></svg><span>Skin</span></button>
  <button class="tab" role="tab" data-tab="upkeep" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.6l1.7 1.7 3.1-3.4M3.5 13.6l1.7 1.7 3.1-3.4M11.5 7h9M11.5 14h9M11.5 20.5h9"/><circle cx="5.5" cy="20.5" r="1.2" fill="currentColor" stroke="none"/></svg><span>Upkeep</span></button>
</div></nav>
<div id="sheet-root" hidden></div>
<div id="toast" class="glass" role="status"></div>

<script>
/* ---------- plan data ---------- */
const EX = [
  ["uni-triceps-ext","Unilateral Triceps Extension",1],
  ["cable-oh-ext","Cable Overhead Extension",1],
  ["uni-bayesian-curl","Unilateral Bayesian Cable Curl",1],
  ["uni-cable-lateral","Unilateral Cable Lateral Raise",1],
  ["uni-db-preacher","Unilateral Dumbbell Preacher Curl",1],
  ["chest-press-machine","Chest Press Machine",2],
  ["uni-cs-neutral-row","Unilateral Chest Supported Neutral Grip Machine Row",1],
  ["wide-lat-pulldown","Wide Grip Lat Pulldown",1],
  ["cs-tbar-kelso","Chest Supported T-Bar Kelso Shrug",1],
  ["uni-leg-ext","Unilateral Leg Extension",1],
  ["lying-leg-curl","Lying Leg Curl",1],
  ["uni-standing-calf","Unilateral Standing Calf Raise",1],
  ["adductor-machine","Adductor Machine",1],
  ["smith-rack-pull","Smith Machine Rack Pull",1],
].map(([id,name,sets])=>({id,name,sets,repLo:4,repHi:6}));

const MEALS = {
  training: [
    ["Meal 1",[["Soy Flakes",50],["Almond Milk",200],["Mixed Berries",300],["Walnuts",10],["Honey",25],["Iodized Salt",1],["Bonsalt",1]]],
    ["Meal 2",[["Tofu",180],["Sweet Potato",750],["Spinach",150],["Nutritional Yeast",10],["Iodized Salt",3]]],
    ["Meal 3",[["Tofu",90],["Basmati Rice",50],["Banana",100],["Iodized Salt",3],["Bonsalt",2]]],
    ["Meal 4",[["Dextrose",45],["Iodized Salt",1],["Bonsalt",1]]],
    ["Meal 5",[["Soy Flakes",50],["Oats",100],["Almond Milk",300],["Mixed Berries",100],["Brazil Nuts",5],["Pumpkin Seeds",20]]],
  ],
  rest: [
    ["Meal 1",[["Soy Flakes",50],["Almond Milk",300],["Walnuts",10],["Honey",25],["Iodized Salt",1],["Bonsalt",2]]],
    ["Meal 2",[["Tofu",180],["Sweet Potato",550],["Spinach",150],["Nutritional Yeast",10],["Iodized Salt",3]]],
    ["Meal 3",[["Basmati Rice",120],["Sweet Potato",200],["Broccoli",100],["Cauliflower",300],["Olive Oil",10],["Iodized Salt",3],["Bonsalt",2]]],
    ["Meal 4",[["Soy Flakes",50],["Oats",100],["Almond Milk",200],["Mixed Berries",100],["Brazil Nuts",5],["Pumpkin Seeds",20],["Honey",25],["Iodized Salt",1]]],
  ],
};

/* ---------- dates ---------- */
const DAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAY3 = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTH = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const diffDays = (a,b) => Math.round((parse(a)-parse(b))/864e5);
const nextOnOrAfter = (s,wd) => { const d = parse(s); d.setDate(d.getDate()+((wd-d.getDay()+7)%7)); return ymd(d); };
const shortDate = s => { const d = parse(s); return `${DAY3[d.getDay()]} ${d.getDate()} ${MON3[d.getMonth()]}`; };
const longToday = () => { const d = new Date(); return `${DAY[d.getDay()]}, ${d.getDate()} ${MONTH[d.getMonth()]}`; };
const ago = s => { const n = diffDays(today(), s); return n===0?"today":n===1?"yesterday":n<7?`${n} days ago`:n<14?"1 week ago":`${Math.floor(n/7)} weeks ago`; };

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const num = v => { if (v===""||v==null) return NaN; return parseFloat(String(v).replace(",",".")); };
const fmtKg = k => String(Math.round(k*100)/100).replace(".", ",");
const fmtG = g => g>=1000 ? `${(Math.round(g/10)/100).toString().replace(".",",")} kg` : `${g} g`;
const ICON = {
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.8l4.4 4.4L19 7.6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 8 14" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5L6.5 7l-5 5.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>',
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.6 4.6L19 7.8"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round"><path d="M5.5 12h13"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5L12 5l6.5 6.5"/></svg>',
};

/* ---------- state ---------- */
const ROBOT_TASKS = [["Robot vacuum: water tanks",0,1],["Robot vacuum: brushes & sensors",0,2],["Robot vacuum: filter & tank rinse",0,4]];
const SHOP_TASKS = [["Grocery shopping",2,1],["Grocery shopping",4,1]];
const mkTask = ([name,wd,every]) => ({ id:uid(), name, wd, every, nextDue: nextOnOrAfter(today(),wd), lastDone:null });
function defaultTasks(){
  return [
    ["Cut fingernails",0,1],["Trim beard",0,1],["Clean out the fridge",0,4],
    ["Clean bathroom",0,1],["Haircut",0,3],["Laundry",0,1],["Change bed sheets",0,2],["Cut toenails",0,2],
    ...ROBOT_TASKS, ...SHOP_TASKS,
  ].map(mkTask);
}
let migrated = false;
function migrate(st){
  if ((st.tasksV || 1) < 2) {
    st.tasks = st.tasks.filter(t => t.name !== "Vacuum floors");
    for (const r of ROBOT_TASKS) if (!st.tasks.some(x => x.name === r[0])) st.tasks.push(mkTask(r));
    st.tasksV = 2; migrated = true;
  }
  if (st.tasksV < 3) {
    for (const r of SHOP_TASKS) if (!st.tasks.some(x => x.name === r[0] && x.wd === r[1])) st.tasks.push(mkTask(r));
    st.tasksV = 3; migrated = true;
  }
  if (st.tasksV < 4) {
    for (const t of st.tasks) if (t.name !== "Grocery shopping" && t.wd !== 0) { t.wd = 0; t.nextDue = nextOnOrAfter(today(), 0); }
    st.tasksV = 4; migrated = true;
  }
  return st;
}
function defaultState(){
  return {
    v:1, tasksV:4,
    trainDays:[1,3,5],
    skin:{
      am:[{id:uid(),name:"Cleanser",note:"Gentle, rinse with lukewarm water"},{id:uid(),name:"Moisturizer",note:"Light lotion"},{id:uid(),name:"Sunscreen",note:"SPF 30+, last step every morning"}],
      pm:[{id:uid(),name:"Cleanser",note:"Remove sunscreen and the day"},{id:uid(),name:"Treatment",note:"Serum or retinoid, 2–3 nights a week"},{id:uid(),name:"Moisturizer",note:"Richer cream"}],
    },
    tasks: defaultTasks(),
    daily:{},
    draft:null,
  };
}
const LS = "regimen.v1", LSW = "regimen.workouts.v1";
function lsGet(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } }
function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
function normalize(s){
  const d = defaultState();
  return migrate({ ...d, ...s, tasksV: s?.tasksV || 1, skin:{ am: s?.skin?.am ?? d.skin.am, pm: s?.skin?.pm ?? d.skin.pm }, tasks: Array.isArray(s?.tasks) ? s.tasks : d.tasks, daily: s?.daily ?? {}, trainDays: Array.isArray(s?.trainDays) ? s.trainDays : d.trainDays });
}
let S = normalize(lsGet(LS) || defaultState());
let W = (lsGet(LSW) || []).sort((a,b)=> (b.finishedAt||"").localeCompare(a.finishedAt||""));
const ui = { tab:"diet", dietView:null, trip:null, discardArm:false };

function day(t = today()){ return S.daily[t] || (S.daily[t] = { meals:{}, skin:{am:{},pm:{}} }); }
function prune(){ const cut = addDays(today(), -30); for (const k of Object.keys(S.daily)) if (k < cut) delete S.daily[k]; }

/* ---------- storage: on this phone, with backup export / restore ---------- */
function persist(){ prune(); lsSet(LS, S); }
function saveWorkout(w){ lsSet(LSW, W); }
function deleteWorkout(id){ W = W.filter(w => w.id !== id); lsSet(LSW, W); }
const isTyping = () => document.activeElement && document.activeElement.tagName === "INPUT";
async function initStorage(){
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch {}
  if (migrated) { migrated = false; persist(); }
}
function syncText(){ return "Saved on this phone. Export a backup now and then, so your history survives a new phone."; }
function exportBackup(){
  const data = JSON.stringify({ app:"askesis", v:1, exportedAt:new Date().toISOString(), state:S, workouts:W });
  const name = `askesis-backup-${today()}.json`;
  const file = new File([data], name, { type:"application/json" });
  if (navigator.canShare && navigator.canShare({ files:[file] })) { navigator.share({ files:[file], title:"Askesis backup" }).catch(() => {}); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function restoreBackup(file){
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch { toast("That file isn’t an Askesis backup"); return; }
    if (!d || d.app !== "askesis" || !d.state) { toast("That file isn’t an Askesis backup"); return; }
    const when = d.exportedAt ? shortDate(ymd(new Date(d.exportedAt))) : "backup";
    toast(`Replace this phone’s data with ${when}?`, () => {
      S = normalize(d.state);
      W = (Array.isArray(d.workouts) ? d.workouts : []).sort((a,b)=> (b.finishedAt||"").localeCompare(a.finishedAt||""));
      lsSet(LS, S); lsSet(LSW, W); render(); toast("Backup restored");
    }, "Restore");
  };
  r.readAsText(file);
}
function renderSyncNote(){ const n = document.getElementById("sync-note"); if (n) n.textContent = syncText(); }

/* ---------- derived ---------- */
function autoType(){
  const t = today();
  if (S.draft && S.draft.date === t && draftHasData()) return "training";
  if (W.some(w => w.date === t)) return "training";
  return S.trainDays.includes(new Date().getDay()) ? "training" : "rest";
}
function lastFor(exId){
  for (const w of W) { const s = w.sets?.[exId]; if (s && s.length) return { date:w.date, sets:s }; }
  return null;
}
function draftHasData(){
  if (!S.draft) return false;
  return Object.values(S.draft.sets).some(arr => arr.some(s => s.kg !== "" || s.reps !== ""));
}
function draftSet(exId, i){ return S.draft?.sets?.[exId]?.[i] || { kg:"", reps:"" }; }
function trend(l, d){
  if (!l) return ["",""];
  const kg = num(d.kg), r = num(d.reps);
  if (isNaN(kg) || isNaN(r)) return ["",""];
  if (kg > l.kg || (kg === l.kg && r > l.reps)) return ["up","↑"];
  if (kg === l.kg && r === l.reps) return ["same","="];
  return ["down","↓"];
}
function scheduleText(t){ return t.every === 1 ? `Every ${DAY[t.wd]}` : `Every ${t.every} weeks on ${DAY[t.wd]}`; }
function dueInfo(t){
  const n = diffDays(t.nextDue, today());
  if (n < 0) return { cls:"st-late", label: n === -1 ? "1 day late" : `${-n} days late`, n };
  if (n === 0) return { cls:"st-today", label:"Today", n };
  if (n === 1) return { cls:"", label:"Tomorrow", n };
  if (n < 7) return { cls:"", label: DAY[parse(t.nextDue).getDay()], n };
  return { cls:"", label: shortDate(t.nextDue), n };
}
const sortedDays = arr => arr.slice().sort((a,b)=>((a+6)%7)-((b+6)%7));

/* ---------- shopping ---------- */
const TRIPS = [2,4];
const SHOP_SKIP = ["Brazil Nuts","Bonsalt","Iodized Salt","Dextrose","Olive Oil","Honey"];
const PACKS = {
  "Tofu":{g:180,label:"180 g"}, "Spinach":{g:450,label:"450 g"}, "Cauliflower":{g:450,label:"450 g"}, "Broccoli":{g:450,label:"450 g"},
  "Oats":{g:500,label:"500 g"}, "Basmati Rice":{g:500,label:"500 g"}, "Nutritional Yeast":{g:200,label:"200 g"},
  "Soy Flakes":{g:100,label:"100 g"}, "Almond Milk":{g:1000,label:"1 L"},
  "Mixed Berries":{g:400,label:"400 g"}, "Walnuts":{g:200,label:"200 g"}, "Pumpkin Seeds":{g:200,label:"200 g"},
};
function upcomingTrip(){ const t = new Date().getDay(); for (let i = 0; i < 7; i++) { const wd = (t+i) % 7; if (TRIPS.includes(wd)) return wd; } return TRIPS[0]; }

/* ---------- view building blocks ---------- */
const view = document.getElementById("view");
const dock = document.getElementById("dock");
const nav = document.getElementById("nav");

function largeTitle(title, sub){
  return `<div class="lt"><div class="lt-text"><div class="eyebrow">${esc(longToday())}</div><h1 class="t-large">${esc(title)}</h1></div></div>${sub?`<p class="lt-sub t-sub">${sub}</p>`:""}`;
}
function segHtml(name, label, buttons, active){
  return `<div class="seg" data-seg="${name}" role="group" aria-label="${label}" style="--n:${buttons.length};--i:${Math.max(0, active)}"><i class="thumb" aria-hidden="true"></i>${buttons.join("")}</div>`;
}
function checkBtn(act, attrs, on, label){
  return `<button class="check" data-act="${act}" ${attrs} aria-pressed="${on}" aria-label="${esc(label)}"><i>${ICON.check}</i></button>`;
}

/* ---------- views ---------- */
function dietView(){
  const auto = autoType();
  const v = ui.dietView || auto;
  const keys = ["training","rest","shopping"];
  const seg = segHtml("plan", "Plan", keys.map(k => `<button data-act="diet-view" data-v="${k}" aria-pressed="${v===k}">${k==="training"?"Training":k==="rest"?"Rest":"Shopping"}${k===auto?'<span class="dot" aria-label="today"></span>':""}</button>`), keys.indexOf(v));
  const top = largeTitle("Diet", `Today is a <strong>${auto} day</strong>`) + seg;
  if (v === "shopping") return top + shoppingView();
  const meals = MEALS[v], dd = day();
  const eaten = meals.filter((_,i) => dd.meals[`${v}-${i}`]).length;
  const prog = v === auto
    ? `<div class="list"><div class="cell" style="display:block"><div style="display:flex;justify-content:space-between;gap:12px"><span class="t-headline">Today’s meals</span><span class="val">${eaten} of ${meals.length}</span></div><div class="bar"><i style="transform:scaleX(${eaten/meals.length})"></i></div></div></div>`
    : `<p class="sec-f t-foot">You’re looking at the ${v} day plan. Today follows the ${auto} day plan.</p>`;
  const cards = meals.map(([name, items], i) => {
    const on = !!dd.meals[`${v}-${i}`];
    return `<section class="sec meal${on?" eaten":""}">
      <div class="sec-h"><h2 class="t-title3">${esc(name)}</h2>
        <button class="cap" data-act="eat" data-k="${v}-${i}" aria-pressed="${on}">${on?ICON.ok+"Eaten":"Mark Eaten"}</button></div>
      <div class="list">${items.map(([n,g]) => `<div class="cell"><span class="grow ttl">${esc(n)}</span><span class="val">${g} g</span></div>`).join("")}</div>
    </section>`;
  }).join("");
  return top + prog + cards;
}

function shoppingView(){
  const wd = ui.trip ?? upcomingTrip();
  const date = nextOnOrAfter(today(), wd);
  const tN = S.trainDays.length, rN = 7 - tN;
  const tot = new Map();
  const add = (meals, times) => meals.forEach(([,items]) => items.forEach(([n,g]) => tot.set(n, (tot.get(n)||0) + g*times)));
  add(MEALS.training, tN); add(MEALS.rest, rN);
  for (const [n,g] of tot) tot.set(n, Math.round(g / 2));
  for (const n of SHOP_SKIP) tot.delete(n);
  const rows = [...tot.entries()].filter(([,g]) => g > 0).sort((a,b) => a[0].localeCompare(b[0]));
  const amount = (n, g) => {
    const p = PACKS[n];
    if (!p) return { right: fmtG(g), meta: "" };
    const k = Math.ceil(g / p.g), lasts = Math.floor(p.g / g);
    const need = p.label.endsWith("L") ? `${g} ml` : fmtG(g);
    return { right: `${k} × ${p.label}`, meta: lasts >= 2 ? `Need ${need} · one pack lasts about ${lasts} trips` : `Need ${need}` };
  };
  const got = day(date).shop || {};
  const gotN = rows.filter(([n]) => got[n]).length;
  const when = diffDays(date, today()) === 0 ? "today" : shortDate(date);
  return `<section class="sec">
      <div class="sec-h"><h2 class="t-title3">${DAY[wd]} Trip</h2><span class="val t-sub c2">${gotN} of ${rows.length}</span></div>
      ${segHtml("trip", "Shopping trip", TRIPS.map(d => `<button data-act="trip" data-v="${d}" aria-pressed="${wd===d}">${DAY[d]}${d===upcomingTrip()?'<span class="dot" aria-label="next trip"></span>':""}</button>`), TRIPS.indexOf(wd))}
      <div class="list">${rows.map(([n,g]) => { const on = !!got[n], a = amount(n, g); return `<div class="cell chk${on?" done":""}">${checkBtn("shop-tick", `data-date="${date}" data-n="${esc(n)}"`, on, n)}<span class="grow"><span class="ttl">${esc(n)}</span>${a.meta?`<div class="sub">${a.meta}</div>`:""}</span><span class="val">${a.right}</span></div>`; }).join("")}</div>
      <p class="sec-f t-foot">Next ${DAY[wd]} trip is ${when}. Each trip buys half a week: ${tN} training and ${rN} rest days split evenly between Tuesday and Thursday. Salt, Bonsalt, dextrose, honey, olive oil and Brazil nuts are left off.</p>
    </section>`;
}

function trainView(){
  const last = W[0];
  const sub = last ? `Last session ${shortDate(last.date)}, ${ago(last.date)}` : "No sessions logged yet";
  const sched = `<div class="list"><div class="cell"><span class="grow ttl">Training Days</span><span class="val">${S.trainDays.length ? sortedDays(S.trainDays).map(d=>DAY3[d]).join(", ") : "None"}</span></div></div>`;
  const cards = EX.map((ex, k) => {
    const l = lastFor(ex.id);
    const ready = l && l.sets.every(s => s.reps >= ex.repHi);
    const setsHtml = Array.from({length: ex.sets}, (_, i) => {
      const ls = l?.sets?.[i], d = draftSet(ex.id, i), [tc, tt] = trend(ls, d);
      return `<div class="set">
        <span class="set-n">${i+1}</span>
        ${ls ? `<button class="last" data-act="copy-last" data-ex="${ex.id}" data-i="${i}" aria-label="Use last: ${fmtKg(ls.kg)} kg for ${ls.reps} reps">${fmtKg(ls.kg)} × ${ls.reps}</button>` : `<span class="last">–</span>`}
        <input class="field" id="kg-${ex.id}-${i}" data-ex="${ex.id}" data-i="${i}" data-f="kg" inputmode="decimal" enterkeyhint="next" autocomplete="off" placeholder="kg" value="${esc(d.kg)}" aria-label="${esc(ex.name)} set ${i+1} weight in kg">
        <input class="field" id="reps-${ex.id}-${i}" data-ex="${ex.id}" data-i="${i}" data-f="reps" inputmode="numeric" pattern="[0-9]*" enterkeyhint="next" autocomplete="off" placeholder="reps" value="${esc(d.reps)}" aria-label="${esc(ex.name)} set ${i+1} reps">
        <span class="trend ${tc}" id="tr-${ex.id}-${i}" aria-hidden="true">${tt}</span>
      </div>`;
    }).join("");
    return `<div class="ex">
      <button class="ex-head" data-act="history" data-ex="${ex.id}"><span class="ex-idx">${k+1}</span>
        <span class="grow"><span class="ttl">${esc(ex.name)}</span><div class="sub t-sub c2">${ex.sets} set${ex.sets>1?"s":""} · ${ex.repLo}–${ex.repHi} reps${l?` · last ${shortDate(l.date)}`:""}</div></span>${ICON.chev}</button>
      ${ready ? `<div class="hint t-foot">${ICON.up}Hit ${ex.repHi} reps last time. Add weight.</div>` : ""}
      <div class="sets"><div class="set set-h"><span>Set</span><span>Last</span><span>kg</span><span>Reps</span><span></span></div>${setsHtml}</div>
    </div>`;
  }).join("");
  const recent = W.slice(0, 8);
  const recentHtml = `<section class="sec"><div class="sec-h"><h2 class="t-title3">Recent Sessions</h2><span class="val t-sub c2">${W.length} total</span></div>
    <div class="list">${recent.length ? recent.map(w => {
      const nEx = Object.keys(w.sets).length, nSets = Object.values(w.sets).reduce((a,s)=>a+s.length,0);
      return `<button class="cell" data-act="session" data-id="${w.id}"><span class="grow"><span class="ttl">${shortDate(w.date)}</span><div class="sub">${nEx} exercise${nEx===1?"":"s"} · ${nSets} set${nSets===1?"":"s"}</div></span>${ICON.chev}</button>`;
    }).join("") : `<div class="empty">Finished workouts appear here.</div>`}</div>
    </section>
    <section class="sec"><div class="sec-h"><h2 class="t-title3">Backup</h2></div>
    <div class="list"><button class="cell action" data-act="export">Export Backup</button><label class="cell action" for="restore-file" style="cursor:pointer">Restore from Backup</label></div>
    <input type="file" id="restore-file" accept="application/json,.json" hidden>
    <p class="sec-f t-foot" id="sync-note">${esc(syncText())}</p></section>`;
  return largeTitle("Full Body", sub) + sched +
    `<section class="sec"><div class="sec-h"><h2 class="t-title3">Workout</h2></div><div class="list">${cards}</div><p class="sec-f t-foot">Tap a last result to fill it in. ↑ means you beat it.</p></section>` + recentHtml;
}

/* skin care routine (fixed) */
const SHOWER_DAYS = [1,3,5]; // Mon, Wed, Fri
const SKIN = {
  am: [
    { id:"am-rinse",  name:"Rinse your face", note:"Lukewarm water" },
    { id:"am-effh",   name:"Effaclar H Iso-Biome", note:"La Roche-Posay · thin layer" },
    { id:"am-spf",    name:"Photoderm AKN Mat SPF 30", note:"Bioderma" },
  ],
  pm: [
    { id:"pm-gel",    name:"Effaclar Purifying Foaming Gel", note:"La Roche-Posay · face", skipOn:SHOWER_DAYS },
    { id:"pm-kelual", name:"Kelual DS cream", note:"Ducray · sides of nose, folds down to your mouth, brows, under mustache and beard" },
    { id:"pm-effh",   name:"Effaclar H Iso-Biome", note:"Anywhere else that feels dry" },
    { id:"pm-sa",     name:"SA Smoothing Cream", note:"CeraVe · arms and thighs" },
    { id:"pm-triakne",name:"Triakne 5%", note:"A dab on individual face pimples only" },
  ],
  shower: [
    { id:"sh-nizoral",name:"Nizoral 2% shampoo", note:"Scalp, beard, mustache, brows and sides of nose. Keep it out of your eyes." },
    { id:"sh-triakne",name:"Triakne 5%", note:"Thin layer on your back" },
    { id:"sh-rinse",  name:"Wait 3–5 minutes, then rinse", note:"Wash the rest of your body meanwhile, then rinse everything with lukewarm water" },
  ],
};
function skinView(){
  const wd = new Date().getDay();
  const showerDay = SHOWER_DAYS.includes(wd);
  const isAM = new Date().getHours() < 15;
  const dd = day();
  const keys = isAM ? ["am", "shower", "pm"] : ["shower", "pm", "am"];
  const title = { am:"Morning", pm:"Night", shower:"Shower" };
  const secs = keys.map(k => {
    const ticks = dd.skin[k] || (dd.skin[k] = {});
    const steps = SKIN[k].filter(s => !(s.skipOn || []).includes(wd));
    const skipped = SKIN[k].filter(s => (s.skipOn || []).includes(wd));
    const doneN = steps.filter(s => ticks[s.id]).length;
    const now = k === "shower" ? (showerDay ? "Today · " : "Mon, Wed, Fri · ") : (k === "am") === isAM ? "Now · " : "";
    const head = `<div class="sec-h"><h2 class="t-title3">${title[k]}</h2><span class="val t-sub c2">${now}${doneN} of ${steps.length}</span></div>`;
    const foot = skipped.length ? `<p class="sec-f t-foot">${skipped.map(s => esc(s.name)).join(", ")} is skipped today because it’s a shower day.</p>` : "";
    return `<section class="sec">${head}<div class="list">${steps.map(s => {
      const on = !!ticks[s.id];
      return `<div class="cell chk${on?" done":""}">${checkBtn("skin-tick", `data-k="${k}" data-id="${s.id}"`, on, s.name)}
        <span class="grow"><span class="ttl">${esc(s.name)}</span>${s.note?`<div class="sub">${esc(s.note)}</div>`:""}</span></div>`;
    }).join("")}</div>${foot}</section>`;
  }).join("");
  let next = 1; while (!SHOWER_DAYS.includes((wd + next) % 7)) next++;
  const sub = showerDay ? "Shower day: Nizoral and Triakne on your back" : `Next shower day: ${next === 1 ? "tomorrow" : DAY[(wd + next) % 7]}`;
  return largeTitle("Skin Care", sub) + secs;
}

function upkeepView(){
  const tasks = S.tasks.map(t => ({ t, d: dueInfo(t) })).sort((a,b) => a.d.n - b.d.n || a.t.name.localeCompare(b.t.name));
  const groups = [["Today", x => x.d.n <= 0], ["This Week", x => x.d.n > 0 && x.d.n < 7], ["Later", x => x.d.n >= 7]];
  const dueN = tasks.filter(x => x.d.n <= 0).length;
  const sub = dueN ? `${dueN} thing${dueN===1?"":"s"} to do today` : "Nothing due today";
  const body = groups.map(([name, f]) => {
    const list = tasks.filter(f);
    if (!list.length) return "";
    return `<section class="sec"><div class="sec-h"><h2 class="t-title3">${name}</h2><span class="val t-sub c2">${list.length}</span></div><div class="list">${list.map(({t,d}) => `
      <div class="cell chk">${checkBtn("task-done", `data-id="${t.id}"`, false, `Mark ${t.name} done`)}
        <span class="grow"><span class="ttl">${esc(t.name)}</span><div class="sub"><span class="${d.cls}">${d.label}</span> · ${scheduleText(t)}</div></span></div>`).join("")}</div></section>`;
  }).join("");
  return largeTitle("Upkeep", sub) + (S.tasks.length ? body : `<div class="list"><div class="empty">No tasks.</div></div>`);
}

function navFor(tab){
  if (tab === "skin") return { title:"Skin Care", r:"" };
  if (tab === "upkeep") return { title:"Upkeep", r:"" };
  if (tab === "train") return { title:"Full Body", r:"" };
  return { title:"Diet", r:"" };
}

function render(){
  const v = { diet: dietView, train: trainView, skin: skinView, upkeep: upkeepView }[ui.tab];
  const prevSeg = {};
  view.querySelectorAll(".seg[data-seg]").forEach(s => prevSeg[s.dataset.seg] = s.style.getPropertyValue("--i"));
  view.innerHTML = v();
  view.querySelectorAll(".seg[data-seg]").forEach(s => {
    const from = prevSeg[s.dataset.seg], to = s.style.getPropertyValue("--i");
    if (from === undefined || from === to) return;
    const th = s.querySelector(".thumb");
    th.style.transition = "none"; s.style.setProperty("--i", from); th.getBoundingClientRect();
    th.style.transition = ""; s.style.setProperty("--i", to);
  });
  const n = navFor(ui.tab);
  document.getElementById("nav-title").textContent = n.title;
  document.getElementById("nav-r").innerHTML = n.r;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  placePill();
  renderDock();
  onScroll();
}
function renderDock(){
  const show = ui.tab === "train" && draftHasData();
  dock.hidden = !show;
  view.classList.toggle("has-dock", show);
  document.body.classList.toggle("dock-on", show);
  if (!show) { ui.discardArm = false; return; }
  dock.innerHTML = `<div class="dock-in"><button class="gbtn glass" data-act="discard">${ui.discardArm ? "Tap to Confirm" : "Discard"}</button><button class="gbtn prominent" data-act="finish">Finish Workout</button></div>`;
}

/* large title collapses into the nav bar on scroll */
let scrollRaf = 0;
function onScroll(){
  cancelAnimationFrame(scrollRaf);
  scrollRaf = requestAnimationFrame(() => nav.classList.toggle("scrolled", window.scrollY > 44));
}
window.addEventListener("scroll", onScroll, { passive:true });

/* ---------- sheets ---------- */
const sheetRoot = document.getElementById("sheet-root");
let sheetHandler = null;
function sheetNav(title, okAct){
  return `<div class="sheet-nav"><button class="circ" data-sheet="close" aria-label="Close">${ICON.x}</button><h2>${esc(title)}</h2>${okAct ? `<button class="circ ok" data-sheet="${okAct}" aria-label="${okAct === "close" ? "Done" : "Save"}">${ICON.ok}</button>` : "<span></span>"}</div>`;
}
function openSheet(html, handler){
  sheetHandler = handler;
  sheetRoot.innerHTML = `<div class="scrim" data-sheet="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="sheet-in"><div class="grabber"></div>${html}</div></div>`;
  sheetRoot.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => sheetRoot.classList.add("open")));
}
function closeSheet(){
  sheetRoot.classList.remove("open");
  setTimeout(() => { if (!sheetRoot.classList.contains("open")) { sheetRoot.hidden = true; sheetRoot.innerHTML = ""; sheetHandler = null; } }, 260);
}
sheetRoot.addEventListener("click", e => {
  const el = e.target.closest("[data-sheet]");
  if (!el) return;
  if (el.dataset.sheet === "close") return closeSheet();
  sheetHandler && sheetHandler(el.dataset.sheet, el, e);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheetRoot.hidden) closeSheet(); });

/* drag a sheet down by its grabber or title bar to dismiss; a quick flick is enough */
let sDrag = null;
const rubber = (o, h) => (o * h * 0.55) / (h + 0.55 * o);
sheetRoot.addEventListener("pointerdown", e => {
  const sh = e.target.closest(".sheet");
  if (!sh || sDrag || !e.target.closest(".grabber,.sheet-nav") || e.target.closest("button,input")) return;
  sDrag = { id:e.pointerId, sh, y0:e.clientY, dy:0, hist:[[e.clientY, performance.now()]], scrim: sheetRoot.querySelector(".scrim") };
  sh.setPointerCapture(e.pointerId);
  sh.style.transition = "none";
});
sheetRoot.addEventListener("pointermove", e => {
  if (!sDrag || e.pointerId !== sDrag.id) return;
  let dy = e.clientY - sDrag.y0;
  if (dy < 0) dy = -rubber(-dy, sDrag.sh.offsetHeight);
  sDrag.dy = dy;
  sDrag.hist.push([e.clientY, performance.now()]); if (sDrag.hist.length > 6) sDrag.hist.shift();
  sDrag.sh.style.transform = `translateY(${dy}px)`;
  sDrag.scrim.style.transition = "none";
  sDrag.scrim.style.opacity = String(1 - Math.max(0, dy) / sDrag.sh.offsetHeight);
});
function endSheetDrag(e){
  if (!sDrag || e.pointerId !== sDrag.id) return;
  const { sh, dy, hist, scrim } = sDrag; sDrag = null;
  const [y0, t0] = hist[0];
  const v = (e.clientY - y0) / Math.max(1, performance.now() - t0);
  scrim.style.transition = ""; scrim.style.opacity = "";
  if (dy > sh.offsetHeight * 0.3 || (v > 0.11 && dy > 12)) {
    sh.style.transition = "transform 260ms var(--ease-drawer)";
    sh.style.transform = "translateY(calc(100% + 16px))";
    closeSheet();
  } else { sh.style.transition = ""; sh.style.transform = ""; }
}
sheetRoot.addEventListener("pointerup", endSheetDrag);
sheetRoot.addEventListener("pointercancel", endSheetDrag);

/* toast: pauses while the app is in the background */
const toastEl = document.getElementById("toast");
let toastTimer = null, toastLeft = 0, toastStart = 0;
function armToast(ms){ clearTimeout(toastTimer); toastLeft = ms; toastStart = Date.now(); toastTimer = setTimeout(() => toastEl.classList.remove("show"), ms); }
function toast(msg, undo, label = "Undo"){
  toastEl.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button">${label}</button>` : ""}`;
  if (undo) toastEl.querySelector("button").onclick = () => { undo(); toastEl.classList.remove("show"); };
  toastEl.classList.add("show");
  armToast(undo ? (label === "Undo" ? 4500 : 8000) : 2200);
}
document.addEventListener("visibilitychange", () => {
  if (!toastEl.classList.contains("show")) return;
  if (document.hidden) { clearTimeout(toastTimer); toastLeft -= Date.now() - toastStart; }
  else armToast(Math.max(toastLeft, 1500));
});

/* exercise history sheet */
function historySheet(exId){
  const ex = EX.find(e => e.id === exId);
  const rows = W.filter(w => w.sets?.[exId]?.length).slice(0, 20);
  let best = null;
  for (const w of W) for (const s of (w.sets?.[exId] || [])) if (!best || s.kg > best.kg || (s.kg === best.kg && s.reps > best.reps)) best = { ...s, date:w.date };
  openSheet(`${sheetNav(ex.name, "close")}
    ${best ? `<div class="list"><div class="cell"><span class="grow ttl">Heaviest Set</span><span class="val st-good t-headline">${fmtKg(best.kg)} kg × ${best.reps}</span></div></div>` : ""}
    <section class="sec"><div class="sec-h"><h2 class="t-title3">History</h2><span class="val t-sub c2">${rows.length}</span></div>
    <div class="list">${rows.length ? rows.map(w => `<div class="cell"><span class="grow ttl">${shortDate(w.date)}</span><span class="val">${w.sets[exId].map(s => `${fmtKg(s.kg)} × ${s.reps}`).join(", ")}</span></div>`).join("") : `<div class="empty">Log a set and finish the workout to start the history.</div>`}</div></section>`);
}

/* session sheet */
function sessionSheet(id){
  const w = W.find(x => x.id === id); if (!w) return;
  let armed = false;
  const list = EX.filter(e => w.sets[e.id]).map(e => `<div class="cell"><span class="grow ttl">${esc(e.name)}</span><span class="val">${w.sets[e.id].map(s => `${fmtKg(s.kg)} × ${s.reps}`).join(", ")}</span></div>`).join("");
  openSheet(`${sheetNav(shortDate(w.date), "close")}
    <div class="list">${list || `<div class="empty">No sets in this session.</div>`}</div>
    <div class="list"><button class="cell destructive" data-sheet="delete">Delete Session</button></div>`, (act, el) => {
    if (act !== "delete") return;
    if (!armed) { armed = true; el.textContent = "Tap Again to Delete"; el.style.fontWeight = "600"; return; }
    deleteWorkout(id); closeSheet(); render(); toast("Session deleted");
  });
}

/* ---------- actions ---------- */
function markTaskDone(id, btn){
  const t = S.tasks.find(x => x.id === id); if (!t) return;
  const prev = { nextDue: t.nextDue, lastDone: t.lastDone };
  const td = today(), step = t.every * 7;
  let next = addDays(t.nextDue, step);
  while (next <= td) next = addDays(next, step);
  t.lastDone = td; t.nextDue = next;
  persist();
  // let the check fill before the row moves to its new group
  if (btn) btn.setAttribute("aria-pressed", "true");
  setTimeout(render, btn ? 380 : 0);
  toast(`${t.name} · next ${shortDate(next)}`, () => { Object.assign(t, prev); persist(); render(); });
}
function ensureDraft(){
  if (!S.draft || S.draft.date !== today()) {
    if (S.draft && draftHasData() && S.draft.date !== today()) finishWorkout(true);
    S.draft = { date: today(), startedAt: new Date().toISOString(), sets: {} };
  }
  return S.draft;
}
function setDraftValue(exId, i, f, val){
  const d = ensureDraft();
  const ex = EX.find(e => e.id === exId);
  if (!d.sets[exId]) d.sets[exId] = Array.from({length: ex.sets}, () => ({ kg:"", reps:"" }));
  d.sets[exId][i][f] = val;
}
function finishWorkout(silent){
  const d = S.draft; if (!d) return;
  const sets = {};
  for (const [exId, arr] of Object.entries(d.sets)) {
    const good = arr.map(s => ({ kg: num(s.kg), reps: Math.round(num(s.reps)) })).filter(s => !isNaN(s.kg) && !isNaN(s.reps) && s.reps > 0);
    if (good.length) sets[exId] = good;
  }
  if (!Object.keys(sets).length) { if (!silent) toast("Enter kg and reps for at least one set"); if (silent) S.draft = null; return; }
  const w = { id: "w" + uid(), date: d.date, startedAt: d.startedAt, finishedAt: new Date().toISOString(), sets };
  W.unshift(w); S.draft = null;
  saveWorkout(w); persist();
  if (!silent) { render(); window.scrollTo({ top: 0 }); toast("Workout saved"); }
}
function rollDraft(){ if (S.draft && S.draft.date !== today()) { finishWorkout(true); S.draft = null; persist(); } }

document.addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (tab) { if (e.detail === 0) setTab(tab.dataset.tab); return; }
  const el = e.target.closest("[data-act]");
  if (!el || el.closest("#sheet-root")) return;
  const a = el.dataset.act;
  if (a === "diet-view") { ui.dietView = el.dataset.v; render(); }
  else if (a === "trip") { ui.trip = +el.dataset.v; render(); }
  else if (a === "shop-tick") { const d = day(el.dataset.date); d.shop = d.shop || {}; const n = el.dataset.n; if (d.shop[n]) delete d.shop[n]; else d.shop[n] = true; persist(); render(); }
  else if (a === "eat") { const m = day().meals; const k = el.dataset.k; if (m[k]) delete m[k]; else m[k] = true; persist(); render(); }
  else if (a === "history") historySheet(el.dataset.ex);
  else if (a === "session") sessionSheet(el.dataset.id);
  else if (a === "copy-last") {
    const l = lastFor(el.dataset.ex)?.sets?.[+el.dataset.i]; if (!l) return;
    setDraftValue(el.dataset.ex, +el.dataset.i, "kg", fmtKg(l.kg));
    setDraftValue(el.dataset.ex, +el.dataset.i, "reps", String(l.reps));
    persist(); render();
    const r = document.getElementById(`reps-${el.dataset.ex}-${el.dataset.i}`); if (r) { r.focus({ preventScroll:true }); r.select(); }
  }
  else if (a === "export") exportBackup();
  else if (a === "finish") finishWorkout(false);
  else if (a === "discard") {
    if (!ui.discardArm) { ui.discardArm = true; renderDock(); ui.discardArm = true; setTimeout(() => { if (ui.discardArm) { ui.discardArm = false; renderDock(); } }, 3000); return; }
    ui.discardArm = false; S.draft = null; persist(); render(); toast("Workout discarded");
  }
  else if (a === "skin-tick") { const sk = day().skin; const m = sk[el.dataset.k] || (sk[el.dataset.k] = {}); const id = el.dataset.id; if (m[id]) delete m[id]; else m[id] = true; persist(); render(); }
  else if (a === "task-done") markTaskDone(el.dataset.id, el);
});

view.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f && t.dataset.ex) {
    const { ex, i, f } = t.dataset;
    const clean = f === "kg" ? t.value.replace(/[^0-9.,]/g, "") : t.value.replace(/[^0-9]/g, "");
    if (clean !== t.value) t.value = clean;
    setDraftValue(ex, +i, f, clean);
    const ls = lastFor(ex)?.sets?.[+i];
    const [tc, tt] = trend(ls, draftSet(ex, +i));
    const tr = document.getElementById(`tr-${ex}-${i}`); if (tr) { tr.className = `trend ${tc}`; tr.textContent = tt; }
    persist();
    if (dock.hidden === draftHasData()) renderDock();
  }
});
view.addEventListener("change", e => {
  if (e.target.id === "restore-file" && e.target.files && e.target.files[0]) { restoreBackup(e.target.files[0]); e.target.value = ""; }
});
view.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.classList.contains("field")) return;
  e.preventDefault();
  const inputs = [...view.querySelectorAll("input.field")];
  const nx = inputs[inputs.indexOf(e.target) + 1];
  if (nx) nx.focus(); else e.target.blur();
});

/* ---------- Liquid Glass tab bar ---------- */
const tabBar = document.querySelector(".tabbar-in");
const tabPill = tabBar.querySelector(".tab-pill");
const tabBtns = [...tabBar.querySelectorAll(".tab")];
let tbDrag = null;
const slotW = () => (tabBar.clientWidth - 8) / tabBtns.length;
function placePill(i){ if (tbDrag) return; if (i === undefined) i = Math.max(0, tabBtns.findIndex(b => b.dataset.tab === ui.tab)); tabPill.style.setProperty("--x", i * slotW()); }
function setHot(i){ tabBtns.forEach((b,k) => b.classList.toggle("hot", k === i)); }
tabBar.addEventListener("pointerdown", e => {
  if (e.button > 0 || tbDrag) return;
  const r = tabBar.getBoundingClientRect(), w = slotW();
  const i = Math.max(0, Math.min(tabBtns.length - 1, Math.floor((e.clientX - r.left - 4) / w)));
  tbDrag = { id:e.pointerId, x0:e.clientX, left:r.left, w, i, moved:false };
  tabBar.setPointerCapture(e.pointerId);
  tabPill.style.setProperty("--x", i * w);          // the lens appears under the finger
  tabBar.classList.add("pressing"); setHot(i);
});
tabBar.addEventListener("pointermove", e => {
  if (!tbDrag || e.pointerId !== tbDrag.id) return;
  if (!tbDrag.moved && Math.abs(e.clientX - tbDrag.x0) < 6) return;
  tbDrag.moved = true; tabBar.classList.add("dragging");   // track the finger 1:1
  const max = (tabBtns.length - 1) * tbDrag.w;
  let x = e.clientX - tbDrag.left - 4 - tbDrag.w / 2;
  if (x < 0) x = -rubber(-x, tbDrag.w); else if (x > max) x = max + rubber(x - max, tbDrag.w);
  tabPill.style.setProperty("--x", x);
  tbDrag.i = Math.max(0, Math.min(tabBtns.length - 1, Math.round(x / tbDrag.w)));
  setHot(tbDrag.i);
});
function endTabDrag(e){
  if (!tbDrag || e.pointerId !== tbDrag.id) return;
  const { i, w } = tbDrag; tbDrag = null;
  tabBar.classList.remove("dragging");
  tabPill.style.setProperty("--x", i * w);           // springs to the nearest tab
  if (e.type === "pointerup") setTab(TABS[i]);
  setTimeout(() => { if (tbDrag) return; tabBar.classList.remove("pressing"); setHot(-1); placePill(); }, 190);
}
tabBar.addEventListener("pointerup", endTabDrag);
tabBar.addEventListener("pointercancel", endTabDrag);
window.addEventListener("resize", () => { tabBar.classList.add("no-anim"); placePill(); requestAnimationFrame(() => tabBar.classList.remove("no-anim")); });

/* ---------- routing ---------- */
const TABS = ["diet","train","skin","upkeep"];
function setTab(t){
  if (!TABS.includes(t)) t = "diet";
  if (ui.tab !== t) { ui.tab = t; ui.dietView = null; window.scrollTo({ top: 0 }); render(); }
  if (location.hash !== "#" + t) history.replaceState(null, "", "#" + t);
}
window.addEventListener("hashchange", () => setTab(location.hash.slice(1)));

ui.tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "diet";
rollDraft();
render();
requestAnimationFrame(() => requestAnimationFrame(() => tabBar.classList.remove("no-anim")));
initStorage();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
setInterval(() => { if ((ui.tab === "upkeep" || ui.tab === "skin") && !isTyping() && sheetRoot.hidden) render(); }, 5 * 60 * 1000);
</script>
